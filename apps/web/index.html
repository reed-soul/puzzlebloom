<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PuzzleBloom — calm puzzle games for curious kids</title>
    <meta
      name="description"
      content="A small garden of quiet puzzle games for children. No ads, no chat, no strangers, no violence. Pick a mood, play a grid, close the tab."
    />
    <meta name="theme-color" content="#ECF7E4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Bing Webmaster Tools ownership. Kept in the repository rather than in a
         dashboard so it is versioned with the site and survives a rebuild; the
         equivalent claim on Google's side verified itself through DNS. -->
    <meta name="msvalidate.01" content="40D5E581B04E89010CB40DA87C789CC5" />
    <!-- Both typefaces are self-hosted (see src/styles/fonts.css). Preloading
         only the latin subset keeps the first paint to 71 kB of font and gives
         the browser a head start on the only files it needs before it can
         render text. -->
    <link
      rel="preload"
      href="/fonts/baloo2-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/nunito-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- og:* and twitter:* are written by src/app/head.ts from site.json, per
         route. Duplicating them here would only give the two sources a chance to
         disagree. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
