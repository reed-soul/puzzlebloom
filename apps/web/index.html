<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PuzzleBloom — calm puzzle games for curious kids</title>
    <meta
      name="description"
      content="A small garden of quiet puzzle games for children. No ads, no chat, no strangers, no violence. Pick a mood, play a grid, close the tab."
    />
    <meta name="theme-color" content="#ECF7E4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Both typefaces are self-hosted (see src/styles/fonts.css). Preloading
         only the latin subset keeps the first paint to 71 kB of font and gives
         the browser a head start on the only files it needs before it can
         render text. -->
    <link
      rel="preload"
      href="/fonts/baloo2-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/nunito-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="PuzzleBloom — calm puzzle games for curious kids" />
    <meta
      property="og:description"
      content="Quiet puzzles that explain themselves. No ads, no chat, no strangers. Built by a parent."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
