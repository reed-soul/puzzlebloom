name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup reads the
      # `packageManager` field, so CI and laptops cannot drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm run lint
      - name: Types
        run: pnpm run typecheck
      - name: Tests
        run: pnpm run test
      # The browser binary is the slow part of this job, so it is cached on the
      # lockfile hash — Playwright's version is pinned there.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # `build:seo` before the suite, not after: the prerender needs a browser,
      # and the tests then run against exactly the artifact that gets deployed —
      # real files per route, real 404s — rather than an SPA preview server.
      - name: Build and prerender
        run: pnpm run build:seo
      - name: End-to-end tests
        run: pnpm exec playwright test
      - name: Keep the trace if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
